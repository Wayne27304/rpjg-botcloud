name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: 檢查程式碼 (Checkout code)
      uses: actions/checkout@v4

    - name: 設定 Node.js 版本 (${{ matrix.node-version }})
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: 安裝套件
      run: npm install

    - name: 測試啟動伺服器 (檢查是否有語法錯誤)
      run: |
        # 使用背景執行啟動伺服器，等待 3 秒後檢查是否順利運作並自動關閉
        node server/index.js &
        SERVER_PID=$!
        sleep 3
        if ps -p $SERVER_PID > /dev/null
        then
           echo "伺服器成功啟動！"
           kill $SERVER_PID
        else
           echo "伺服器啟動失敗！"
           exit 1
        fi
